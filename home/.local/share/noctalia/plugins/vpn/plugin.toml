# WireGuard bar widget — status + toggle for one wg-quick endpoint via ~/bin/vpn.
# Lives in the dotfiles castle; noctalia discovers this dir as its "local" source.

id = "dos/vpn"
name = "VPN"
version = "1.0.0"
plugin_api = 14
author = "dos"
license = "MIT"
icon = "shield"
description = "WireGuard endpoint status and toggle via ~/bin/vpn."
tags = ["bar", "indicator", "network", "vpn"]

[[widget]]
id = "status"
entry = "widget.luau"

[[widget.setting]]
key = "endpoint"
type = "select"
label_key = "settings.endpoint.label"
description_key = "settings.endpoint.description"
default = "home"
options = [
  { value = "ams", label_key = "settings.endpoint.options.ams" },
  { value = "home", label_key = "settings.endpoint.options.home" },
  { value = "nyc", label_key = "settings.endpoint.options.nyc" },
  { value = "sfo", label_key = "settings.endpoint.options.sfo" },
]

[[widget.setting]]
key = "up_glyph"
type = "glyph"
label_key = "settings.up_glyph.label"
description_key = "settings.up_glyph.description"
default = "shield-check"

[[widget.setting]]
key = "up_color"
type = "color"
label_key = "settings.up_color.label"
description_key = "settings.up_color.description"
default = "primary"

[[widget.setting]]
key = "down_glyph"
type = "glyph"
label_key = "settings.down_glyph.label"
description_key = "settings.down_glyph.description"
default = "shield-off"

[[widget.setting]]
key = "down_color"
type = "color"
label_key = "settings.down_color.label"
description_key = "settings.down_color.description"
default = "on_surface"
