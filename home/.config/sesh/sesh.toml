#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

sort_order = ["tmux", "config", "zoxide"]

[default_session]
preview_command = "eza --all --git --icons --color=always {}"

# Sessions

[[session]]
name = "Nix cfg"
path = "~/Code/nixos-skwrls"

[[session]]
name = "Dots"
path = "~/.homesick/repos/dotfiles"

[[session]]
name = "Blog"
path = "~/Code/ohc.works/squirrels.wtf"
windows = ["just test"]
layout = "main-horizontal"

[[session]]
name = "Incident"
path = "~/Code/dnsimple"

[[session]]
name = "Dream"
path = "~/Sync/muck"
startup_command = "tmux rename-window 🐰"

[[session]]
name = "Flex"
path = "/deep_end/AppConfigs/Flexget"
panes = ["cmd"]
layout = "main-horizontal"

# Wilin out

[[wildcard]]
pattern = "~/Code/dnsimple/*"
startup_command = "claude"

# Windows

[[window]]
name = "just test"
startup_script = "just test"

# Panes

[[pane]]
name = "just test"
startup_command = "just test"

[[pane]]
name = "cmd"
