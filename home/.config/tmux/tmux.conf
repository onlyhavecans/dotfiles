set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Easier splits & all splits carry path over
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# New windows always in ~
bind c new-window -c "~"

# clear screen
bind C-l send-keys 'C-l'
bind l send-keys 'C-l'

# Vim Power
set -g mode-keys vi
set -g @shell_mode 'vi'

bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'V' send -X select-line
bind -T copy-mode-vi 'r' send -X rectangle-toggle
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel

# VIM CAPS for reszing
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# always have lazygit at hand
unbind g
bind g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E lazygit

# have a sesh
unbind t
bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Sesh settings
bind -N "last-session (via sesh) " L run-shell "sesh last" # replace last with sesh's last
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# Setting it up
set -g base-index 1
set -w -g pane-base-index 1

set -g mouse on
set -g set-titles on
set -g display-time 1000
set -g history-limit 50000
set -g renumber-windows on
set -g clock-mode-style 24

set -g monitor-activity on

# NeoVim Requests this
set -sg escape-time 10
set -sg focus-events on
set -a terminal-features 'foot:RGB'
set -a terminal-features '*256color:RGB'
set -g allow-passthrough on

# Pi has needs too
set -g extended-keys on
set -g extended-keys-format csi-u

# fix direnv
# https://github.com/direnv/direnv/wiki/Tmux
set-option -g update-environment "DIRENV_DIFF DIRENV_DIR DIRENV_WATCHES"
set-environment -gu DIRENV_DIFF
set-environment -gu DIRENV_DIR
set-environment -gu DIRENV_WATCHES
set-environment -gu DIRENV_LAYOUT

# List of plugins
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme
source-file -q "$XDG_CONFIG_HOME/tmux/bar.conf"

# Sometimes we need to be local
source-file -q "$XDG_CONFIG_HOME/local/tmux.conf"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell '~/.config/tmux/plugins/tpm/tpm'
source-file -q "$XDG_CONFIG_HOME/tmux/themes/everforest-dark.conf"
