# Everforest Dark Hard (see docs/everforest.md)
# @theme_* feed bar.conf at render time.
set -gq @theme_surface_container_low "#2E383C"
set -gq @theme_surface_container "#374145"
set -gq @theme_surface_container_highest "#495156"
set -gq @theme_on_surface "#D3C6AA"
set -gq @theme_on_surface_variant "#859289"
set -gq @theme_primary "#A7C080"
set -gq @theme_on_primary "#272E33"
set -gq @theme_secondary_container "#DBBC7F"
set -gq @theme_on_secondary_container "#272E33"
set -gq @theme_tertiary_container "#7FBBB3"
set -gq @theme_on_tertiary_container "#272E33"
set -gq @theme_error_container "#E67E80"
set -gq @theme_on_error_container "#272E33"

set -gq status-style "bg=#2E383C,fg=#D3C6AA"
set -gq window-status-style "bg=#374145,fg=#859289"
set -gq window-status-current-style "bg=#495156,fg=#D3C6AA,bold"
set -gq window-status-last-style "fg=#D3C6AA,bold"
set -gq window-status-activity-style "bg=#7FBBB3,fg=#272E33"
set -gq window-status-bell-style "bg=#E67E80,fg=#272E33,bold"
set -gq pane-border-style "fg=#495156"
set -gq pane-active-border-style "fg=#A7C080"
set -gq mode-style "bg=#4C3743,fg=#D3C6AA,bold"
set -gq message-style "bg=#374145,fg=#D3C6AA"
set -gq message-command-style "bg=#374145,fg=#D3C6AA"
set -gq popup-style "bg=#272E33,fg=#D3C6AA"
set -gq popup-border-style "fg=#859289"
set -gq menu-style "bg=#374145,fg=#D3C6AA"
set -gq menu-selected-style "bg=#A7C080,fg=#272E33,bold"
set -gq menu-border-style "fg=#859289"
set -gq copy-mode-match-style "bg=#7FBBB3,fg=#272E33"
set -gq copy-mode-current-match-style "bg=#A7C080,fg=#272E33,bold"
set -gq copy-mode-selection-style "bg=#4C3743,fg=#D3C6AA"
set -gq clock-mode-colour "#A7C080"
