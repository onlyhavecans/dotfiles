# Everforest Light Hard (see docs/everforest.md)
# @theme_* feed bar.conf at render time.
set -gq @theme_surface_container_low "#F8F5E4"
set -gq @theme_surface_container "#F2EFDF"
set -gq @theme_surface_container_highest "#E8E5D5"
set -gq @theme_on_surface "#5C6A72"
set -gq @theme_on_surface_variant "#939F91"
set -gq @theme_primary "#8DA101"
set -gq @theme_on_primary "#FFFBEF"
set -gq @theme_secondary_container "#DFA000"
set -gq @theme_on_secondary_container "#FFFBEF"
set -gq @theme_tertiary_container "#3A94C5"
set -gq @theme_on_tertiary_container "#FFFBEF"
set -gq @theme_error_container "#F85552"
set -gq @theme_on_error_container "#FFFBEF"

set -gq status-style "bg=#F8F5E4,fg=#5C6A72"
set -gq window-status-style "bg=#F2EFDF,fg=#939F91"
set -gq window-status-current-style "bg=#E8E5D5,fg=#5C6A72,bold"
set -gq window-status-last-style "fg=#5C6A72,bold"
set -gq window-status-activity-style "bg=#3A94C5,fg=#FFFBEF"
set -gq window-status-bell-style "bg=#F85552,fg=#FFFBEF,bold"
set -gq pane-border-style "fg=#E8E5D5"
set -gq pane-active-border-style "fg=#8DA101"
set -gq mode-style "bg=#F0F2D4,fg=#5C6A72,bold"
set -gq message-style "bg=#F2EFDF,fg=#5C6A72"
set -gq message-command-style "bg=#F2EFDF,fg=#5C6A72"
set -gq popup-style "bg=#FFFBEF,fg=#5C6A72"
set -gq popup-border-style "fg=#939F91"
set -gq menu-style "bg=#F2EFDF,fg=#5C6A72"
set -gq menu-selected-style "bg=#8DA101,fg=#FFFBEF,bold"
set -gq menu-border-style "fg=#939F91"
set -gq copy-mode-match-style "bg=#3A94C5,fg=#FFFBEF"
set -gq copy-mode-current-match-style "bg=#8DA101,fg=#FFFBEF,bold"
set -gq copy-mode-selection-style "bg=#F0F2D4,fg=#5C6A72"
set -gq clock-mode-colour "#8DA101"
