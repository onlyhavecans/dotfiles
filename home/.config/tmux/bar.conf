# Status bar layout. Colors resolve at render time from @theme_*
# (themes/everforest-light.conf).
# Glyphs need a Nerd Font: powerline arrows, tmux, zoom, calendar, clock, host icons.

set -g status-position bottom
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 80
set -g status-left-style none
set -g status-right-style none
set -wg window-status-separator ""

# Session block. Turns accent color while the prefix key is held.
set -g status-left "#{?client_prefix,#[bg=#{@theme_tertiary_container},fg=#{@theme_on_tertiary_container}],#[bg=#{@theme_surface_container_highest},fg=#{@theme_on_surface}]}#[bold]  #S #{?client_prefix,#[fg=#{@theme_tertiary_container}],#[fg=#{@theme_surface_container_highest}]}#[bg=#{@theme_surface_container_low},nobold]"

# Windows
set -wg window-status-format "#[bg=#{@theme_surface_container},fg=#{@theme_surface_container_low}]#[fg=#{@theme_on_surface_variant}] #I  #W#{?window_zoomed_flag, 󰍉,} #[bg=#{@theme_surface_container_low},fg=#{@theme_surface_container}]"
set -wg window-status-current-format "#[bg=#{@theme_primary},fg=#{@theme_surface_container_low}]#[fg=#{@theme_on_primary},bold] #I  #W#{?window_zoomed_flag, 󰍉,} #[bg=#{@theme_surface_container_low},fg=#{@theme_primary},nobold]"

# Right side: mode flag, date, time, host.
set -g status-right "#{?pane_in_mode,#[fg=#{@theme_secondary_container}]#[bg=#{@theme_secondary_container},fg=#{@theme_on_secondary_container}]  #{pane_mode} ,}#{?pane_synchronized,#[fg=#{@theme_error_container}]#[bg=#{@theme_error_container},fg=#{@theme_on_error_container}]  sync ,}#[fg=#{@theme_surface_container}]#[bg=#{@theme_surface_container},fg=#{@theme_on_surface_variant}]  %H:%M #[fg=#{@theme_surface_container_highest}]#[bg=#{@theme_surface_container_highest},fg=#{@theme_on_surface},bold]  #h "
