# Status bar layout on top of the Noctalia palette.
# Colors resolve at render time from @noctalia_* so theme changes apply live.
# Glyphs need a Nerd Font: powerline arrows, tmux, zoom, calendar, clock, host icons.

set -g status-position bottom
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 80
set -g status-left-style none
set -g status-right-style none
set -wg window-status-separator ""

# Session block. Turns accent color while the prefix key is held.
set -g status-left "#{?client_prefix,#[bg=#{@noctalia_tertiary_container},fg=#{@noctalia_on_tertiary_container}],#[bg=#{@noctalia_surface_container_highest},fg=#{@noctalia_on_surface}]}#[bold]  #S #{?client_prefix,#[fg=#{@noctalia_tertiary_container}],#[fg=#{@noctalia_surface_container_highest}]}#[bg=#{@noctalia_surface_container_low},nobold]"

# Windows
set -wg window-status-format "#[bg=#{@noctalia_surface_container},fg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_surface_variant}] #I  #W#{?window_zoomed_flag, 󰍉,} #[bg=#{@noctalia_surface_container_low},fg=#{@noctalia_surface_container}]"
set -wg window-status-current-format "#[bg=#{@noctalia_primary},fg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_primary},bold] #I  #W#{?window_zoomed_flag, 󰍉,} #[bg=#{@noctalia_surface_container_low},fg=#{@noctalia_primary},nobold]"

# Right side: mode flag, date, time, host.
set -g status-right "#{?pane_in_mode,#[fg=#{@noctalia_secondary_container}]#[bg=#{@noctalia_secondary_container},fg=#{@noctalia_on_secondary_container}]  #{pane_mode} ,}#{?pane_synchronized,#[fg=#{@noctalia_error_container}]#[bg=#{@noctalia_error_container},fg=#{@noctalia_on_error_container}]  sync ,}#[fg=#{@noctalia_surface_container}]#[bg=#{@noctalia_surface_container},fg=#{@noctalia_on_surface_variant}]  %H:%M #[fg=#{@noctalia_surface_container_highest}]#[bg=#{@noctalia_surface_container_highest},fg=#{@noctalia_on_surface},bold]  #h "
