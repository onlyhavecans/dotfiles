[  add speed -0.5
]  add speed 0.5

# Voice clarity EQ: rumble cut, mud cut, presence boost
alt+v af toggle "@voice:lavfi=[highpass=f=100,equalizer=f=250:t=q:w=1.2:g=-3,equalizer=f=3000:t=q:w=1:g=4]" ; show-text "Audio filters: ${af}"

# Loudness leveller: evens out quiet and loud speech
n af toggle "@norm:lavfi=[dynaudnorm=f=150:g=15]" ; show-text "Audio filters: ${af}"
