[general]
corner-roundness = 12
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 2
output-filename = "~/Pictures/Screenshots/%Y-%m-%d_%H-%M-%S.png"
default-fill-shapes = false
actions-on-escape = ["save-to-clipboard", "save-to-file", "exit"]

zoom-factor = 1.2

[font]
family = "Inter"
style = "Bold"

[color-palette]
# These will be shown in the toolbar for quick selection
palette = [
  "#ff1493",
  "#00ffff",
  "#a52a2a",
  "#dc143c",
  "#ffd700",
  "#008000",
]
