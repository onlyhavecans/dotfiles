[general]
corner-roundness = 12
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 2
output-filename = "~/Pictures/Screenshots/%Y-%m-%d_%H-%M-%S.png"
default-fill-shapes = false
actions-on-escape = ["save-to-clipboard", "save-to-file", "exit"]

zoom-factor = 1.2

[font]
family = "Inter"
style = "Bold"

[color-palette]
# Gruvbox bright accents (docs/gruvbox.md); distinguishable on screenshots
palette = [
  "#fb4934",
  "#fe8019",
  "#fabd2f",
  "#b8bb26",
  "#83a598",
  "#d3869b",
]
