# Umbriel starting configuration
#
# Check edits with `umbriel config validate`.
# Complete reference: https://docs.noctalia.dev/umbriel/

# ==============================================================================
# Includes
# Included files are applied in list order. The including file is applied last.
# https://docs.noctalia.dev/umbriel/configuration/#include

[include]
files = [
  "/run/current-system/sw/share/umbriel/effects/border/pulse/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/border/audio/effect.toml",
]

[include.optional]
files = ["host.toml"]

# ==============================================================================
# General
# https://docs.noctalia.dev/umbriel/configuration/#general
#
[general]
autostart = ["noctalia", "foot ~/bin/tm"]
xwayland_native_resolution = true
show_cheatsheet = false

# ==============================================================================
# Environment
# https://docs.noctalia.dev/umbriel/configuration/#environment
#
[environment]
SSH_AUTH_SOCK = "/home/dos/.ssh/proton-pass-agent.sock"

# ==============================================================================
# Lid events
# https://docs.noctalia.dev/umbriel/configuration/#events
#
[events]
lid_close = "noctalia msg session lock-and-suspend"

# ==============================================================================
# Outputs
# Run `umbriel outputs` to find names and modes.
# https://docs.noctalia.dev/umbriel/outputs/
#
[output.eDP-1]
scale = 2

# ==============================================================================
# Appearance
# https://docs.noctalia.dev/umbriel/appearance/
#
[appearance]
prefer_no_csd = true
border_width = 3
corner_radius = 15

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# ==============================================================================
# Colors
# https://docs.noctalia.dev/umbriel/appearance#colors
#
[colors]
background = "#f8f5e4ff"
text_primary = "#5c6a72ff"
text_muted = "#939f91ff"
accent_primary = "#8da101ff"
accent_secondary = "#dfa000ff"
warning = "#3a94c5ff"
error = "#f85552ff"
insert_hint = "#3a94c580"
backdrop = "#272e33ff"

[colors.border]
focused = "#8da101ff"
unfocused = "#272e3380"
outer = "#fffbefff"

[colors.overview]
background_tint = "#fffbef88"
badge = "#8da101ff"
workspace_background = "#fffbefff"

[colors.tab_bar]
background = "#f8f5e4ff"
text = "#939f91ff"
active = "#8da101ff"
active_text = "#fffbefff"
active_unfocused = "#f8f5e4ff"
active_unfocused_text = "#5c6a72ff"
urgent = "#f85552ff"
urgent_text = "#fffbefff"

[colors.title_bar]
background = "#f8f5e4ff"
background_unfocused = "#fffbefff"
text = "#5c6a72ff"
text_unfocused = "#939f91ff"
close = "#f85552ff"
close_glyph = "#fffbefff"
close_glyph_hover = "#fffbefff"
maximize = "#8da101ff"
maximize_glyph = "#fffbefff"
maximize_glyph_hover = "#fffbefff"
minimize = "#dfa000ff"
minimize_glyph = "#fffbefff"
minimize_glyph_hover = "#fffbefff"

# ==============================================================================
# Animations
# https://docs.noctalia.dev/umbriel/animation/
#
[animation.dialogs]
# Shade over a window while a modal dialog is attached to it.
dim = 0.3

# ==============================================================================
# Effects
# https://docs.noctalia.dev/umbriel/effects/
#

# ==============================================================================
# Input
# https://docs.noctalia.dev/umbriel/input/
#
[input]
middle_click_paste = false

[input.keyboard]
layout = "us"
options = "ctrl:nocaps,altwin:menu_win"
numlock_toggle = true

[input.touchpad]
tap = true
tap_and_drag = true
drag_lock = "timeout"
natural_scroll = true
disable_while_typing = true
disable_on_external_mouse = true
tap_button_map = "left_right_middle"

[input.mouse]
natural_scroll = true

# TODO: Make a custom Apple Keyboard & Trackpad Input
# [[input.device]]
# name = "Acme Split Keyboard"
# layout = "us"
# variant = "colemak_dh"
# model = "pc104angle"

[input.focus]
follows_mouse = "sloppy"
follows_mouse_max_scroll = 0.0

[input.cursor]
theme = "everforest-cursors"
size = 32
hardware_cursor = true
hide_when_typing = true
hide_timeout_ms = 1000

# ==============================================================================
# Keybinds
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
#
[keybinds]
"Mod+Space" = "spawn noctalia msg panel-toggle launcher"
"Alt+Space" = "spawn ~/bin/wlr-toggle"

"Mod+Return" = { action = "spawn foot", repeat = false }
"Mod+Alt+Return" = { action = "spawn foot ~/bin/tm", repeat = false }
"Mod+Y" = { action = "spawn foot yazi", repeat = false }
"Mod+B" = { action = "spawn firefox", repeat = false }
"Mod+Alt+B" = { action = "spawn firefox --private-window", repeat = false }
"Alt+Period" = { action = "spawn voxtype record start", release = "spawn voxtype record stop", repeat = false }

"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Slash" = "cheatsheet-toggle"

# Noctalia
"Mod+Period" = "spawn noctalia msg bar-toggle"
"Mod+Escape" = "spawn noctalia msg panel-toggle session"
"Alt+Tab" = "spawn noctalia msg panel-toggle launcher /win "
"Mod+N" = "spawn noctalia msg panel-toggle clipboard"
"Alt+N" = "spawn noctalia msg panel-toggle control-center notification"
"Mod+Alt+Comma" = "spawn noctalia msg settings-toggle"
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Shift+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }

# Media, volume and brightness keys
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }
# Framework Key
"XF86AudioMedia" = "spawn noctalia msg session lock"

# Focus and movement
"Mod+C" = "column-center"

# Focus in output
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-or-workspace-down"
"Mod+K" = "window-focus-or-workspace-up"
"Mod+L" = "window-focus-right"

# Focus Workspace
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

# Move in output
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-or-workspace-down"
"Mod+Shift+k" = "window-move-or-workspace-up"
"Mod+Shift+L" = "column-move-right"

"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

# Focus to output
"Mod+Left" = "output-focus-left"
"Mod+Down" = "output-focus-down"
"Mod+Up" = "output-focus-up"
"Mod+Right" = "output-focus-right"

# Move to output
"Mod+Shift+Left" = "window-move-to-output-left"
"Mod+Shift+Down" = "window-move-to-output-down"
"Mod+Shift+Up" = "window-move-to-output-up"
"Mod+Shift+Right" = "window-move-to-output-right"

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }

"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }

"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Minus" = "window-modify-primary-extent -0.02"
"Mod+Equal" = "window-modify-primary-extent +0.02"
"Mod+Ctrl+Minus" = "window-modify-secondary-extent -0.02"
"Mod+Ctrl+Equal" = "window-modify-secondary-extent +0.02"

"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"

"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+L" = "column-focus-tab-next"
"Mod+Alt+H" = "column-focus-tab-previous"

"Mod+O" = { action = "overview-toggle", repeat = false }

# Scratchpad
"Mod+S" = "scratchpad-toggle"
"Mod+Shift+S" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Ctrl+S" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"

# ==============================================================================
# Layout
# https://docs.noctalia.dev/umbriel/layout/
#
[layout]
mode = "scrolling"
gap = 3
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = false

# ==============================================================================
# Window rules
# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/
#
[[window_rule]]
blur = true
blur_optimized = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 150, y = 150, anchor = "top_right" }
default_focused = false
default_pinned = true

[[window_rule]]
match.is_floating = true
title_bar = "on"

[[window_rule]]
match.app_id = "^com\\.obsproject\\.Studio$"
background_render = true

# See docs/user/window-rules.md#capture-protection.
[[window_rule]]
match.app_id = ["1password", "proton-pass", "proton-mail", "signal", "slack", "md.obsidian.Obsidian"]
block_capture = true

[[window_rule]]
match.title = "Copy color to Clipboard"
default_floating = true

[[window_rule]]
match.app_id = ["^Calculator$", "^espanso$", "^file-picker$", "^qalculate"]
default_floating = true

[[window_rule]]
match.app_id = "^steam$"
match.title = "^Big Picture Mode$"
default_fullscreen = true

[[window_rule]]
match.app_id = "^steam_app"
default_fullscreen = true

[[window_rule]]
match.app_id = ["^btop$", "^feishin$", "^net-filebot-Main$", "^ratune$"]
default_maximize = true

[[window_rule]]
match.app_id = ["^com\\.obsproject\\.Studio$", "^com\\.bitwig\\.BitwigStudio"]
match.is_floating = false
default_maximize = true

[[window_rule]]
match.app_id = ["^proton-mail$", "^chrome-twitch", "^slack$"]
default_scrolling_extent = 0.667

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#3a94c5FF"
border_color_unfocused = "#c3dce2FF"

# ==============================================================================
# Layer rules
# https://docs.noctalia.dev/umbriel/layer-rules/
#
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false
