[mgr]
sort_by = "mtime"
sort_reverse = true
sort_dir_first = true

[opener]
set-wallpaper = [{ run = "noctalia msg wallpaper-set %s1", for = "linux", desc = "Set as wallpaper" }]
upload-zipline = [{ run = "upload %s", for = "linux", desc = "Upload to zipline" }]

[open]
prepend_rules = [
  { mime = "image/**", use = ["open", "set-wallpaper", "upload-zipline", "reveal"] },
]

[plugin]
prepend_fetchers = [
  # git.yazi
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" }
]

prepend_preloaders = [
  # Do not preload files in mounted locations:
  { url = "/run/user/1000/gvfs/**/*", run = "noop" },
  { url = "/run/media/dos/**/*", run = "noop" },

  # media.yazi: thumbnail + mediainfo
  { mime = "{audio,video,image}/*", run = "media" },
]

prepend_previewers = [
  # media.yazi: thumbnail + mediainfo
  { mime = "{audio,video,image}/*", run = "media" },
]
