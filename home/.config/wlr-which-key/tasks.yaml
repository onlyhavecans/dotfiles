---
font: RecMonoDuotone Nerd Font Propo 26
background: "#FFFBEFee" # everforest light hard bg0
color: "#5C6A72ff" # everforest light hard fg
border: "#8DA101ff" # everforest light hard green (noctalia primary)
border_width: 3
corner_r: 20
padding: 25 # Defaults to corner_r

menu:
  - key: b
    desc: Backlight
    submenu:
      - key: "1"
        desc: 10%
        cmd: noctalia msg brightness-set 10
      - key: "3"
        desc: 30%
        cmd: noctalia msg brightness-set 30
      - key: "5"
        desc: 50%
        cmd: noctalia msg brightness-set 50
      - key: "7"
        desc: 70%
        cmd: noctalia msg brightness-set 70
  - key: c
    desc: Cast Target
    submenu:
      - key: c
        desc: Clear
        cmd: niri msg action clear-dynamic-cast-target
      - key: m
        desc: Monitor
        cmd: niri msg action set-dynamic-cast-monitor
      - key: w
        desc: Window
        cmd: niri msg action set-dynamic-cast-window
  - key: d
    desc: Do Not Disturb
    cmd: noctalia msg notification-dnd-toggle
  - key: i
    desc: Input Vol
    submenu:
      - key: "1"
        desc: 100%
        cmd: noctalia msg mic-volume-set 100
      - key: "3"
        desc: 30%
        cmd: noctalia msg mic-volume-set 30
      - key: m
        desc: Mute
        cmd: noctalia msg mic-mute
  - key: m
    desc: Music
    submenu:
      - key: " "
        desc: Play/Pause
        cmd: noctalia msg media toggle
      - key: ","
        desc: Prev
        cmd: noctalia msg media previous
      - key: "."
        desc: Next
        cmd: noctalia msg media next
  - key: o
    desc: Output Vol
    submenu:
      - key: "1"
        desc: 100%
        cmd: noctalia msg volume-set 100
      - key: "3"
        desc: 30%
        cmd: noctalia msg volume-set 30
      - key: "6"
        desc: 60%
        cmd: noctalia msg volume-set 60
      - key: m
        desc: Mute
        cmd: noctalia msg volume-mute
  - key: p
    desc: Power Profile
    submenu:
      - key: s
        desc: Saver
        cmd: noctalia msg power-set power-saver
      - key: b
        desc: Balanced
        cmd: noctalia msg power-set balanced
      - key: p
        desc: Performance
        cmd: noctalia msg power-set performance
  - key: v
    desc: VPN
    submenu:
      - key: a
        desc: Amsterdam
        cmd: ~/bin/vpn ams
      - key: h
        desc: Home
        cmd: ~/bin/vpn home
      - key: n
        desc: New York
        cmd: ~/bin/vpn nyc
      - key: s
        desc: San Francisco
        cmd: ~/bin/vpn sfo
  - key: w
    desc: Wallpaper
    submenu:
      - key: g
        desc: Get Path
        cmd: notify-send "Wall" "$(noctalia msg wallpaper-get)"
      - key: n
        desc: Next
        cmd: noctalia msg wallpaper-next
      - key: p
        desc: Prev
        cmd: noctalia msg wallpaper-previous
      - key: r
        desc: Random
        cmd: noctalia msg wallpaper-random
      - key: s
        desc: Select
        cmd: noctalia msg panel-toggle wallpaper
