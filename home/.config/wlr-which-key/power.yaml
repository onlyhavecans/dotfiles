---
# Theming
font: RecMonoDuotone Nerd Font Propo 26
background: "#FFFBEFee" # everforest light hard bg0
color: "#5C6A72ff" # everforest light hard fg
border: "#F85552ff" # everforest light hard red (noctalia error): destructive menu
separator: " ➜ "
border_width: 4
corner_r: 20

menu:
  - key: l
    desc: "\U000F033E Lock"
    cmd: noctalia msg session lock
  - key: p
    desc: "\U000F0425 Poweroff"
    cmd: noctalia msg session shutdown
  - key: q
    desc: "\U000F0343 Quit"
    cmd: noctalia msg session logout
  - key: r
    desc: "\U000F0465 Reboot"
    cmd: noctalia msg session reboot
  - key: s
    desc: "\U000F0904 Suspend"
    cmd: noctalia msg session suspend
  - key: i
    desc: Idle Inhibit
    cmd: noctalia msg caffeine-toggle
