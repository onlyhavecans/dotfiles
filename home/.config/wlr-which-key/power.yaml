---
# Theming
font: Inter Display 32
background: "#fffbefee" # everforest bg0
color: "#5c6a72ff" # everforest fg
border: "#df69baff" # everforest purple: destructive menu
separator: " ➜ "
border_width: 4
corner_r: 20

anchor: center

menu:
  - key: "l"
    desc: "\U000F033E Lock"
    cmd: swaylock
  - key: "p"
    desc: "\U000F0425 Poweroff"
    cmd: systemctl poweroff
  - key: "r"
    desc: "\U000F0465 Reboot"
    cmd: systemctl reboot
  - key: "s"
    desc: "\U000F0904 Suspend"
    cmd: systemctl suspend
  - key: "q"
    desc: "\U000F0343 Quit"
    cmd: niri msg action quit
