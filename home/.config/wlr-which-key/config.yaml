---
font: RecMonoDuotone Nerd Font Propo 26
background: "#faf4edf0"
color: "#575279"
border: "#907aa9"
border_width: 4
corner_r: 30
padding: 25 # Defaults to corner_r
rows_per_column: 12

# NOTE: Keep launchers shallow: depth <= 2
# NOTE: Nest attributes e.g. music->volume->mute
# NOTE: Keep desc terse, skimmability wins
# NOTE: Keep alpha sorted
# NOTE: Double-tap = the group's default action
# NOTE: Mark non-initial keys like S[l]ack
# NOTE: Submenu by what I am doing
menu:
  - key: " "
    desc: Terminal
    cmd: foot --login tm
  - key: \
    desc: Quick Pass
    cmd: 1password --quick-access

  - key: a
    desc: Audio
    submenu:
      - key: b
        desc: Bitwig Studio
        cmd: bitwig-studio
      - key: c
        desc: Coppwr
        cmd: coppwr
      - key: e
        desc: EasyEffects
        cmd: easyeffects
      - key: m
        desc: Mic
        submenu:
          - key: "0"
            desc: 100%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 100%
          - key: "3"
            desc: 30%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 30%
          - key: m
            desc: Mute
            cmd: swayosd-client --input-volume mute-toggle
      - key: p
        desc: pwvuControl
        cmd: pwvucontrol
      - key: q
        desc: qpwGraph
        cmd: qpwgraph
      - key: t
        desc: Milky[T]racker
        cmd: milkytracker
      - key: y
        desc: Audacit[y]
        cmd: audacity

  - key: b
    desc: Browse
    submenu:
      - key: b
        desc: Firefox
        cmd: firefox
      - key: c
        desc: Copy URL
        cmd: ~/bin/url-from-window
      - key: p
        desc: Private
        cmd: firefox --private-window
      - key: m
        desc: MD URL
        cmd: ~/bin/url-from-window md
      - key: o
        desc: Brave Origin
        cmd: brave-origin
      - key: s
        desc: Search
        cmd: ~/bin/search-fuzzel
      - key: w
        desc: Work Brave
        cmd: brave

  - key: c
    desc: Chats
    submenu:
      - key: d
        desc: Discord
        cmd: discord
      - key: n
        desc: NWW
        cmd: nww
      - key: s
        desc: Signal
        cmd: signal-desktop
      - key: t
        desc: TinTin++
        cmd: foot --app-id=tintin ~/bin/tw

  - key: e
    desc: Email
    submenu:
      - key: e
        desc: Thunderbird
        cmd: thunderbird
      - key: d
        desc: Dictate Note
        cmd: ~/bin/em-dictate
      - key: t
        desc: Type Note
        cmd: ~/bin/em-fuzzel

  - key: f
    desc: File Manager
    submenu:
      - key: f
        desc: Yazi
        cmd: foot --app-id=yazi --working-directory=$HOME/Downloads yazi
      - key: n
        desc: Nautilus
        cmd: nautilus
      - key: u
        desc: Upload
        cmd: ~/bin/upload-yazi

  - key: g
    desc: Gaming
    submenu:
      - key: r
        desc: RetroArch
        cmd: retroarch
      - key: s
        desc: Steam
        cmd: steam

  - key: h
    desc: Clip[h]ist
    submenu:
      - key: h
        desc: pick
        cmd: cliphist-fuzzel-img
      - key: w
        desc: wipe
        cmd: cliphist wipe

  - key: i
    desc: V[i]ewers
    submenu:
      - key: d
        desc: PDF Viewer
        cmd: papers
      - key: i
        desc: Image Viewer
        cmd: loupe
      - key: p
        desc: Image Editor
        cmd: photopea-chromium

  - key: j
    desc: Jump
    submenu:
      - key: b
        desc: Browser
        cmd: ~/bin/focus-app-fuzzel firefox
      - key: e
        desc: Email
        cmd: ~/bin/focus-app-fuzzel thunderbird
      - key: j
        desc: Jump to Win
        cmd: ~/bin/focus-app-fuzzel
      - key: o
        desc: Obsidian
        cmd: ~/bin/focus-app-fuzzel obsidian
      - key: s
        desc: Slack
        cmd: ~/bin/focus-app-fuzzel slack
      - key: t
        desc: Terminal
        cmd: ~/bin/focus-app-fuzzel foot

  - key: "l"
    desc: Back[l]ight
    submenu:
      - key: "1"
        desc: 10%
        cmd: brightnessctl --class=backlight set 10%
      - key: "3"
        desc: 30%
        cmd: brightnessctl --class=backlight set 30%
      - key: "5"
        desc: 50%
        cmd: brightnessctl --class=backlight set 50%
      - key: "7"
        desc: 70%
        cmd: brightnessctl --class=backlight set 70%

  - key: m
    desc: Music
    submenu:
      - key: " "
        desc: Play/Pause
        cmd: playerctl play-pause
      - key: a
        desc: Amberol
        cmd: amberol
      - key: b
        desc: Prev Track
        cmd: playerctl previous
      - key: m
        desc: Feishin
        cmd: feishin
      - key: n
        desc: Next Track
        cmd: playerctl next
      - key: p
        desc: Picard
        cmd: picard
      - key: v
        desc: Volume
        submenu:
          - key: "3"
            desc: 30%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SINK@ 30%
          - key: "6"
            desc: 60%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SINK@ 60%
          - key: "0"
            desc: 100%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SINK@ 100%
          - key: m
            desc: Mute
            cmd: swayosd-client --output-volume mute-toggle

  - key: o
    desc: N[o]tepad
    cmd: xdg-open "obsidian://open?vault=Vault"

  - key: p
    desc: Power
    submenu:
      - key: "l"
        desc: "\U000F033E Lock"
        cmd: swaylock
      - key: "p"
        desc: "\U000F0425 Power Off"
        cmd: systemctl poweroff
      - key: "q"
        desc: "\U000F0343 Quit Session"
        cmd: niri msg action quit
      - key: "r"
        desc: "\U000F0465 Reboot"
        cmd: systemctl reboot
      - key: "s"
        desc: "\U000F0904 Suspend"
        cmd: systemctl suspend

  - key: r
    desc: Recording
    submenu:
      - key: b
        desc: Clip Firefox Audio
        cmd: ~/bin/clip_app firefox
      - key: m
        desc: Clip mpv Audio
        cmd: ~/bin/clip_app mpv
      - key: o
        desc: OBS Studio
        cmd: obs
      - key: r
        desc: Record Screen
        cmd: ~/bin/record-screen
      - key: f
        desc: Screenshot Full Screen
        cmd: ~/bin/screenshot screen
      - key: s
        desc: Screenshot Selection
        cmd: ~/bin/screenshot selection
      - key: w
        desc: Screenshot Window
        cmd: ~/bin/screenshot window

  - key: s
    desc: Streaming
    submenu:
      - key: b
        desc: VBridger
        cmd: steam steam://rungameid/1898830
      - key: c
        desc: StreamController
        cmd: streamcontroller
      - key: d
        desc: Cast
        submenu:
          - key: c
            desc: Clear
            cmd: niri msg action clear-dynamic-cast-target
          - key: m
            desc: Monitor
            cmd: niri msg action set-dynamic-cast-monitor
          - key: w
            desc: Window
            cmd: niri msg action set-dynamic-cast-window
      - key: f
        desc: Firebot
        cmd: firebot
      - key: o
        desc: OBS
        cmd: obs
      - key: s
        desc: Start Streaming
        cmd: foot ~/bin/streaming_time
      - key: t
        desc: Tuber
        cmd: tuber
      - key: v
        desc: VTube Studio
        cmd: steam steam://rungameid/1325860

  - key: t
    desc: Theme
    submenu:
      - key: m
        desc: Get Wall Mood
        cmd: notify-send "Wall" "$(wall which)"
      - key: n
        desc: Next Wall
        cmd: wall next
      - key: r
        desc: Random Wall
        cmd: wall random
      - key: s
        desc: Set Wall Mood
        cmd: wall menu

  - key: u
    desc: Utilities
    submenu:
      - key: \
        desc: Passwords
        cmd: 1password
      - key: b
        desc: Btop
        cmd: foot --app-id=btop btop
      - key: c
        desc: Calculator
        cmd: gnome-calculator
      - key: d
        desc: Disks
        cmd: gnome-disks
      - key: f
        desc: Font Viewer
        cmd: gnome-font-viewer
      - key: g
        desc: GPU Top
        cmd: foot --app-id=amdgpu_top amdgpu_top
      - key: p
        desc: Color [P]icker
        cmd: wl-color-picker clipboard
      - key: t
        desc: Toggle Touchpad
        cmd: ~/bin/toggle-touchpad

  - key: v
    desc: Video
    submenu:
      - key: f
        desc: Filebot
        cmd: filebot
      - key: j
        desc: Jellyfin
        cmd: jellyfin-chromium
      - key: r
        desc: Video T[r]immer
        cmd: video-trimmer
      - key: t
        desc: Twitch
        cmd: twitch-chromium
      - key: w
        desc: Watch in mpv
        cmd: ~/bin/watch-url

  - key: w
    desc: Work
    submenu:
      - key: b
        desc: Browser
        cmd: brave
      - key: c
        desc: Cursor
        cmd: cursor
      - key: d
        desc: DNPull
        cmd: foot --working-directory=$HOME/Code --hold ~/bin/dnpull
      - key: e
        desc: Email
        cmd: thunderbird
      - key: n
        desc: Netbird-ui
        cmd: netbird-ui
      - key: o
        desc: Obsidian
        cmd: xdg-open "obsidian://open?vault=DNSimple"
      - key: s
        desc: Slack
        cmd: slack
      - key: t
        desc: " Timer"
        cmd: focus-timer
      - key: v
        desc: VPN
        submenu:
          - key: a
            desc: Amsterdam
            cmd: ~/bin/vpn ams
          - key: h
            desc: Home
            cmd: ~/bin/vpn home
          - key: n
            desc: New York
            cmd: ~/bin/vpn nyc
          - key: s
            desc: San Francisco
            cmd: ~/bin/vpn sfo
      - key: z
        desc: Zoom
        cmd: zoom

  - key: x
    desc: Vo[x]type
    cmd: voxtype record toggle
