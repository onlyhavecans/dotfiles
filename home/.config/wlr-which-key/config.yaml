---
font: Inter Display 32
background: "#faf4edf0"
color: "#575279"
border: "#907aa9"
border_width: 4
corner_r: 12
padding: 15 # Defaults to corner_r
rows_per_column: 8 # No limit by default

anchor: center

menu:
  - key: space
    desc: Fuzzel
    cmd: fuzzel --width 20
  - key: \
    desc: Passwords
    cmd: 1password
  - key: b
    desc: Browser
    cmd: brave-origin
  - key: e
    desc: Email
    cmd: thunderbird
  - key: f
    desc: File Manager
    cmd: foot -e yazi
  - key: n
    desc: Notepad
    cmd: xdg-open "obsidian://open?vault=Vault"

  - key: a
    desc: Audio
    submenu:
      - key: a
        desc: Amberol
        cmd: amberol
      - key: b
        desc: Bitwig Studio
        cmd: bitwig-studio
      - key: c
        desc: Crosspipe
        cmd: crosspipe
      - key: e
        desc: EasyEffects
        cmd: easyeffects
      - key: f
        desc: Feishin
        cmd: feishin
      - key: m
        desc: MilkyTracker
        cmd: milkytracker
      - key: p
        desc: Picard
        cmd: picard
      - key: u
        desc: A[u]dacity
        cmd: audacity
      - key: v
        desc: PWVuControl
        cmd: pwvucontrol

  - key: c
    desc: Chats
    submenu:
      - key: d
        desc: Discord
        cmd: discord
      - key: s
        desc: Signal
        cmd: signal-desktop
      - key: w
        desc: Slack
        cmd: slack

  - key: d
    desc: Documents
    submenu:
      - key: d
        desc: PDF Viewer
        cmd: papers
      - key: i
        desc: Image Viewer
        cmd: loupe
      - key: p
        desc: Image Editor
        cmd: photopea-chromium

  - key: g
    desc: Gaming
    submenu:
      - key: r
        desc: RetroArch
        cmd: retroarch
      - key: s
        desc: Steam
        cmd: steam

  - key: p
    desc: Power
    submenu:
      - key: "l"
        desc: "\U000F033E Lock"
        cmd: swaylock
      - key: "s"
        desc: "\U000F0425 Shutdown"
        cmd: systemctl poweroff
      - key: "r"
        desc: "\U000F0465 Reboot"
        cmd: systemctl reboot
      - key: "u"
        desc: "\U000F0904 S[u]spend"
        cmd: systemctl suspend
      - key: "o"
        desc: "\U000F0343 L[o]gout"
        cmd: niri msg action quit

  - key: r
    desc: Recording
    submenu:
      - key: f
        desc: Clip Firefox Audio
        cmd: ~/bin/clip_firefox
      - key: m
        desc: Clip mpv Audio
        cmd: ~/bin/clip_mpv
      - key: r
        desc: Record Screen
        cmd: ~/bin/record-screen
      - key: d
        desc: Screenshot Screen
        cmd: ~/bin/screenshot screen
      - key: s
        desc: Screenshot Selection
        cmd: ~/bin/screenshot selection
      - key: w
        desc: Screenshot Window
        cmd: ~/bin/screenshot window

  - key: s
    desc: System Utils
    submenu:
      - key: a
        desc: AMDGpuTop
        cmd: amdgpu_top --gui
      - key: b
        desc: Btop
        cmd: foot -e btop
      - key: c
        desc: Calculator
        cmd: gnome-calculator
      - key: d
        desc: Disks
        cmd: gnome-disks
      - key: f
        desc: Font Viewer
        cmd: gnome-font-viewer
      - key: n
        desc: Files
        cmd: nautilus
      - key: p
        desc: Pomodoro Timer
        cmd: gnome-pomodoro

  - key: t
    desc: S[t]reaming
    submenu:
      - key: b
        desc: VBridger
        cmd: steam steam://rungameid/1898830
      - key: c
        desc: StreamController
        cmd: streamcontroller
      - key: f
        desc: Firefox
        cmd: firefox
      - key: i
        desc: F[i]rebot
        cmd: firebot
      - key: o
        desc: OBS
        cmd: obs
      - key: s
        desc: Start Streaming
        cmd: foot -e ~/bin/streaming_time
      - key: t
        desc: Tuber
        cmd: tuber
      - key: v
        desc: VTube Studio
        cmd: steam steam://rungameid/1325860

  - key: v
    desc: Video
    submenu:
      - key: f
        desc: Filebot
        cmd: filebot
      - key: j
        desc: Jellyfin
        cmd: jellyfin-chromium
      - key: t
        desc: Twitch
        cmd: twitch-chromium
      - key: v
        desc: Video Trimmer
        cmd: video-trimmer
      - key: w
        desc: Watch url in clipboad
        cmd: ~/bin/watch-url

  - key: w
    desc: Work
    submenu:
      - key: b
        desc: Browser
        cmd: brave
      - key: c
        desc: Cursor
        cmd: cursor
      - key: n
        desc: Netbird-ui
        cmd: netbird-ui
      - key: o
        desc: Obsidian
        cmd: xdg-open "obsidian://open?vault=DNSimple"
      - key: s
        desc: Slack
        cmd: slack
      - key: z
        desc: Zoom
        cmd: zoom
