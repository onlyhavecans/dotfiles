---
font: RecMonoDuotone Nerd Font Propo 26
background: "#FFFBEFee" # bg0
color: "#5C6A72ff" # fg
border: "#8DA101ff" # green
border_width: 3
corner_r: 15
padding: 25 # Defaults to corner_r

# NOTE: Keep desc terse, skimmability wins
# NOTE: Keep alpha sorted, symbols first
# NOTE: Double-tap = the group's default action
menu:
  - key: /
    desc: Actions
    cmd: noctalia msg panel-open launcher "/do "

  - key: a
    desc: B[a]cklight
    submenu:
      - key: "1"
        desc: 10%
        cmd: brightnessctl --class=backlight set 10%
      - key: "3"
        desc: 30%
        cmd: brightnessctl --class=backlight set 30%
      - key: "5"
        desc: 50%
        cmd: brightnessctl --class=backlight set 50%
      - key: "7"
        desc: 70%
        cmd: brightnessctl --class=backlight set 70%

  - key: b
    desc: Browser
    submenu:
      - key: c
        desc: Copy URL
        cmd: ~/bin/url-from-window
      - key: m
        desc: MD URL
        cmd: ~/bin/url-from-window md
      - key: s
        desc: Search
        cmd: noctalia msg panel-open launcher "/s "

  - key: d
    desc: Do Not Disturb
    cmd: noctalia msg notification-dnd-toggle

  - key: i
    desc: Input Vol
    submenu:
      - key: "1"
        desc: 100%
        cmd: wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 100%
      - key: "3"
        desc: 30%
        cmd: wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 30%
      - key: m
        desc: Mute
        cmd: noctalia msg mic-mute

  - key: l
    desc: Bluetooth Toggle
    cmd: "bluetoothctl show | grep -q 'PowerState: off' && bluetoothctl power on || bluetoothctl power off"

  - key: m
    desc: Music
    submenu:
      - key: " "
        desc: Play/Pause
        cmd: playerctl play-pause
      - key: ","
        desc: Prev
        cmd: playerctl previous
      - key: "."
        desc: Next
        cmd: playerctl next

  - key: o
    desc: Output Vol
    submenu:
      - key: "1"
        desc: 100%
        cmd: wpctl set-volume @DEFAULT_AUDIO_SINK@ 100%
      - key: "3"
        desc: 30%
        cmd: wpctl set-volume @DEFAULT_AUDIO_SINK@ 30%
      - key: "6"
        desc: 60%
        cmd: wpctl set-volume @DEFAULT_AUDIO_SINK@ 60%
      - key: m
        desc: Mute
        cmd: noctalia msg volume-mute

  - key: p
    desc: Power Profile
    submenu:
      - key: s
        desc: Saver
        cmd: powerprofilesctl set power-saver
      - key: b
        desc: Balanced
        cmd: powerprofilesctl set balanced
      - key: p
        desc: Performance
        cmd: powerprofilesctl set performance

  - key: t
    desc: Timer
    submenu:
      - key: s
        desc: Start
        cmd: tomat start
      - key: t
        desc: Toggle
        cmd: tomat toggle
      - key: k
        desc: Skip
        cmd: tomat skip
      - key: e
        desc: End
        cmd: tomat stop
      - key: r
        desc: Restart
        cmd: tomat stop; tomat start

  - key: v
    desc: VPN
    submenu:
      - key: a
        desc: Amsterdam
        cmd: ~/bin/vpn ams
      - key: h
        desc: Home
        cmd: ~/bin/vpn home
      - key: n
        desc: New York
        cmd: ~/bin/vpn nyc
      - key: p
        desc: Proton VPN
        cmd: protonvpn-app
      - key: s
        desc: San Francisco
        cmd: ~/bin/vpn sfo

  - key: x
    desc: Vo[x]type
    cmd: voxtype record toggle
