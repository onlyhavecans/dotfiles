---
font: RecMonoDuotone Nerd Font Propo 26
background: "#FFFBEFee" # bg0
color: "#5C6A72ff" # fg
border: "#8DA101ff" # green
border_width: 3
corner_r: 15
padding: 25 # Defaults to corner_r

# NOTE: Verbs only. Apps live in the noctalia launcher (.desktop files),
#       one-off scripts in noctalia/actions.tsv
# NOTE: Top level = one-tap dailies or "what I am doing" groups
# NOTE: Keep launchers shallow: depth <= 2
# NOTE: Nest attributes e.g. audio->volume->mute
# NOTE: Keep desc terse, skimmability wins
# NOTE: Keep alpha sorted, symbols first
# NOTE: Double-tap = the group's default action
# NOTE: Mark non-initial keys like S[l]ack
# NOTE: Free keys: a c d f g h j k l m n q s u v w y z
menu:
  - key: /
    desc: Actions
    cmd: noctalia msg panel-open launcher "/do "

  - key: b
    desc: Browser
    submenu:
      - key: c
        desc: Copy URL
        cmd: ~/bin/url-from-window
      - key: m
        desc: MD URL
        cmd: ~/bin/url-from-window md
      - key: s
        desc: Search
        cmd: noctalia msg panel-open launcher "/s "

  - key: i
    desc: +Change...
    cmd: wlr-which-key tasks

  - key: p
    desc: +Power
    cmd: wlr-which-key power

  - key: r
    desc: Capture
    submenu:
      - key: f
        desc: Shot Full Screen
        cmd: noctalia msg screenshot-fullscreen
      - key: r
        desc: Record Screen
        cmd: ~/bin/record-screen
      - key: s
        desc: Shot Selection
        cmd: noctalia msg screenshot-region

  - key: t
    desc: Timer
    submenu:
      - key: s
        desc: Start
        cmd: tomat start
      - key: t
        desc: Toggle
        cmd: tomat toggle
      - key: k
        desc: Skip
        cmd: tomat skip
      - key: e
        desc: End
        cmd: tomat stop
      - key: r
        desc: Restart
        cmd: tomat stop; tomat start

  - key: x
    desc: Vo[x]type
    cmd: voxtype record toggle
