---
font: RecMonoDuotone Nerd Font Propo 24
background: "#faf4edf0"
color: "#575279"
border: "#907aa9"
border_width: 5
corner_r: 30
padding: 25 # Defaults to corner_r
rows_per_column: 12

# NOTE: Keep launchers shallow: depth <= 2
# NOTE: Nest attributes e.g. music->volume->mute
# NOTE: Keep desc terse, skimmability wins
# NOTE: Keep alpha sorted
# NOTE: Double-tap = the group's default action
# NOTE: Mark non-initial keys like S[l]ack
# NOTE: Submenu by what I am doing
menu:
  - key: " "
    desc: Terminal
    cmd: foot --login tm
  - key: \
    desc: Quick Pass
    cmd: 1password --quick-access

  - key: a
    desc: Audio
    submenu:
      - key: b
        desc: Bitwig Studio
        cmd: bitwig-studio
      - key: c
        desc: Coppwr
        cmd: coppwr
      - key: e
        desc: EasyEffects
        cmd: easyeffects
      - key: m
        desc: Mic
        submenu:
          - key: "0"
            desc: 100%
            cmd: noctalia msg mic-volume-set 100
          - key: "3"
            desc: 30%
            cmd: noctalia msg mic-volume-set 30
          - key: m
            desc: Mute
            cmd: noctalia msg mic-mute
      - key: p
        desc: pwvuControl
        cmd: pwvucontrol
      - key: q
        desc: qpwGraph
        cmd: qpwgraph
      - key: t
        desc: Milky[T]racker
        cmd: milkytracker
      - key: y
        desc: Audacit[y]
        cmd: audacity

  - key: b
    desc: Browse
    submenu:
      - key: b
        desc: Firefox
        cmd: firefox
      - key: c
        desc: Copy URL
        cmd: ~/bin/url-from-window
      - key: p
        desc: Private
        cmd: firefox --private-window
      - key: m
        desc: MD URL
        cmd: ~/bin/url-from-window md
      - key: o
        desc: Brave Origin
        cmd: brave-origin
      - key: s
        desc: Search
        cmd: ~/bin/search-fuzzel
      - key: w
        desc: Work Brave
        cmd: brave

  - key: c
    desc: Chats
    submenu:
      - key: d
        desc: Discord
        cmd: discord
      - key: n
        desc: NWW
        cmd: nww
      - key: s
        desc: Signal
        cmd: signal-desktop
      - key: t
        desc: TinTin++
        cmd: foot --app-id=tintin ~/bin/tw

  - key: e
    desc: Email
    submenu:
      - key: e
        desc: Thunderbird
        cmd: thunderbird
      - key: d
        desc: Dictate Note
        cmd: ~/bin/em-dictate
      - key: t
        desc: Type Note
        cmd: ~/bin/em-fuzzel

  - key: f
    desc: File Manager
    submenu:
      - key: f
        desc: Yazi
        cmd: foot --app-id=yazi --working-directory=$HOME/Downloads yazi
      - key: n
        desc: Nautilus
        cmd: nautilus
      - key: u
        desc: Upload
        cmd: ~/bin/upload-yazi

  - key: g
    desc: Gaming
    submenu:
      - key: r
        desc: RetroArch
        cmd: retroarch
      - key: s
        desc: Steam
        cmd: steam

  - key: i
    desc: V[i]ewers
    submenu:
      - key: d
        desc: PDF Viewer
        cmd: papers
      - key: i
        desc: Image Viewer
        cmd: loupe
      - key: p
        desc: Image Editor
        cmd: photopea-chromium

  - key: j
    desc: Jump
    submenu:
      - key: b
        desc: Browser
        cmd: ~/bin/focus-app-fuzzel firefox
      - key: e
        desc: Email
        cmd: ~/bin/focus-app-fuzzel thunderbird
      - key: j
        desc: Jump to Win
        cmd: ~/bin/focus-app-fuzzel
      - key: o
        desc: Obsidian
        cmd: ~/bin/focus-app-fuzzel obsidian
      - key: s
        desc: Slack
        cmd: ~/bin/focus-app-fuzzel slack
      - key: t
        desc: Terminal
        cmd: ~/bin/focus-app-fuzzel foot

  - key: "l"
    desc: Back[l]ight
    submenu:
      - key: "1"
        desc: 10%
        cmd: noctalia msg brightness-set 10
      - key: "3"
        desc: 30%
        cmd: noctalia msg brightness-set 30
      - key: "7"
        desc: 70%
        cmd: noctalia msg brightness-set 70

  - key: m
    desc: Music
    submenu:
      - key: " "
        desc: Play/Pause
        cmd: noctalia msg media toggle
      - key: a
        desc: Amberol
        cmd: amberol
      - key: b
        desc: Prev Track
        cmd: noctalia msg media previous
      - key: m
        desc: Feishin
        cmd: feishin
      - key: n
        desc: Next Track
        cmd: noctalia msg media next
      - key: p
        desc: Picard
        cmd: picard
      - key: v
        desc: Volume
        submenu:
          - key: "0"
            desc: 100%
            cmd: noctalia msg volume-set 100
          - key: "3"
            desc: 30%
            cmd: noctalia msg volume-set 30
          - key: "6"
            desc: 60%
            cmd: noctalia msg volume-set 60
          - key: m
            desc: Mute
            cmd: noctalia msg volume-mute

  - key: n
    desc: Noctalia
    submenu:
      - key: b
        desc: Bar Toggle
        cmd: noctalia msg bar-toggle
      - key: c
        desc: Clipboard
        cmd: noctalia msg panel-toggle clipboard
      - key: d
        desc: Do Not Disturb
        cmd: noctalia msg notification-dnd-toggle
      - key: h
        desc: Home Panel
        cmd: noctalia msg panel-toggle control-center home
      - key: i
        desc: Caffeine
        cmd: noctalia msg caffeine-toggle
      - key: n
        desc: Notifications
        cmd: noctalia msg panel-toggle control-center notifications
      - key: o
        desc: OSD Toggle
        cmd: noctalia msg osd-toggle
      - key: s
        desc: Settings
        cmd: noctalia msg settings-toggle
      - key: w
        desc: World Clock
        cmd: noctalia msg panel-toggle noctalia/world_clock:panel
      - key: x
        desc: Clear Notifs
        cmd: noctalia msg notification-clear-active

  - key: o
    desc: N[o]tepad
    cmd: xdg-open "obsidian://open?vault=Vault"

  - key: p
    desc: Power
    submenu:
      - key: "c"
        desc: "\U000F0210 Cycle Power Profile"
        cmd: noctalia msg power-cycle
      - key: "l"
        desc: "\U000F033E Lock"
        cmd: noctalia msg session lock
      - key: "p"
        desc: "\U000F0425 Power Off"
        cmd: systemctl poweroff
      - key: "q"
        desc: "\U000F0343 Quit Session"
        cmd: niri msg action quit
      - key: "r"
        desc: "\U000F0465 Reboot"
        cmd: systemctl reboot
      - key: "s"
        desc: "\U000F0904 Suspend"
        cmd: systemctl suspend

  - key: r
    desc: Recording
    submenu:
      - key: b
        desc: Clip Firefox Audio
        cmd: ~/bin/clip_app firefox
      - key: m
        desc: Clip mpv Audio
        cmd: ~/bin/clip_app mpv
      - key: o
        desc: OBS Studio
        cmd: obs
      - key: r
        desc: Record Screen
        cmd: noctalia msg plugin noctalia/screen_recorder:service all toggle
      - key: f
        desc: Screenshot Full Screen
        cmd: noctalia msg screenshot-fullscreen
      - key: s
        desc: Screenshot Selection
        cmd: noctalia msg screenshot-region
      - key: w
        desc: Screenshot Window
        cmd: ~/bin/screenshot window

  - key: s
    desc: Streaming
    submenu:
      - key: b
        desc: VBridger
        cmd: steam steam://rungameid/1898830
      - key: c
        desc: StreamController
        cmd: streamcontroller
      - key: d
        desc: Cast
        submenu:
          - key: c
            desc: Clear
            cmd: niri msg action clear-dynamic-cast-target
          - key: m
            desc: Monitor
            cmd: niri msg action set-dynamic-cast-monitor
          - key: w
            desc: Window
            cmd: niri msg action set-dynamic-cast-window
      - key: f
        desc: Firebot
        cmd: firebot
      - key: o
        desc: OBS
        cmd: obs
      - key: s
        desc: Start Streaming
        cmd: foot ~/bin/streaming_time
      - key: t
        desc: Tuber
        cmd: tuber
      - key: v
        desc: VTube Studio
        cmd: steam steam://rungameid/1325860

  - key: t
    desc: Theme
    submenu:
      - key: d
        desc: Dark/Light
        cmd: noctalia msg theme-mode-toggle
      - key: g
        desc: Night Light
        cmd: noctalia msg nightlight-toggle
      - key: n
        desc: Next Wall
        cmd: noctalia msg wallpaper-next
      - key: p
        desc: Prev Wall
        cmd: noctalia msg wallpaper-previous
      - key: r
        desc: Random Wall
        cmd: noctalia msg wallpaper-random
      - key: s
        desc: Set Wall
        cmd: noctalia msg panel-toggle wallpaper

  - key: u
    desc: Utilities
    submenu:
      - key: \
        desc: Passwords
        cmd: 1password
      - key: b
        desc: Btop
        cmd: foot --app-id=btop btop
      - key: c
        desc: Calculator
        cmd: gnome-calculator
      - key: d
        desc: Disks
        cmd: gnome-disks
      - key: e
        desc: Emoji Picker
        cmd: noctalia msg panel-open launcher /emo
      - key: f
        desc: Font Viewer
        cmd: gnome-font-viewer
      - key: g
        desc: GPU Top
        cmd: foot --app-id=amdgpu_top amdgpu_top
      - key: p
        desc: Color [P]icker
        cmd: wl-color-picker clipboard
      - key: t
        desc: Toggle Touchpad
        cmd: ~/bin/toggle-touchpad

  - key: v
    desc: Video
    submenu:
      - key: f
        desc: Filebot
        cmd: filebot
      - key: j
        desc: Jellyfin
        cmd: jellyfin-chromium
      - key: r
        desc: Video T[r]immer
        cmd: video-trimmer
      - key: t
        desc: Twitch
        cmd: twitch-chromium
      - key: w
        desc: Watch in mpv
        cmd: ~/bin/watch-url

  - key: w
    desc: Work
    submenu:
      - key: b
        desc: Browser
        cmd: brave
      - key: c
        desc: Cursor
        cmd: cursor
      - key: d
        desc: DNPull
        cmd: foot --working-directory=$HOME/Code --hold ~/bin/dnpull
      - key: e
        desc: Email
        cmd: thunderbird
      - key: n
        desc: Netbird-ui
        cmd: netbird-ui
      - key: o
        desc: Obsidian
        cmd: xdg-open "obsidian://open?vault=DNSimple"
      - key: s
        desc: Slack
        cmd: slack
      - key: t
        desc: " Timer"
        cmd: focus-timer
      - key: v
        desc: VPN
        submenu:
          - key: a
            desc: Amsterdam
            cmd: ~/bin/vpn ams
          - key: h
            desc: Home
            cmd: ~/bin/vpn home
          - key: n
            desc: New York
            cmd: ~/bin/vpn nyc
          - key: s
            desc: San Francisco
            cmd: ~/bin/vpn sfo
      - key: z
        desc: Zoom
        cmd: zoom

  - key: x
    desc: Vo[x]type
    cmd: voxtype record toggle
