---
font: Inter Display 32
background: "#faf4edf0"
color: "#575279"
border: "#907aa9"
border_width: 4
corner_r: 12
padding: 15 # Defaults to corner_r
rows_per_column: 9

menu:
  - key: b
    desc: Browser
    cmd: brave-origin
  - key: e
    desc: Email
    cmd: thunderbird
  - key: f
    desc: File Manager
    cmd: foot -e yazi
  - key: n
    desc: Notepad
    cmd: xdg-open "obsidian://open?vault=Vault"

  - key: a
    desc: Wall
    submenu:
      - key: m
        desc: Get mood
        cmd: notify-send "Wall" "$(wall which)"
      - key: s
        desc: Set Mood
        cmd: wall menu
      - key: n
        desc: Next Wall
        cmd: wall next
      - key: r
        desc: Random Wall
        cmd: wall random

  - key: c
    desc: Chats
    submenu:
      - key: d
        desc: Discord
        cmd: discord
      - key: n
        desc: NWW
        cmd: nww "+1"
      - key: s
        desc: Signal
        cmd: signal-desktop
      - key: w
        desc: Slack
        cmd: slack

  - key: d
    desc: Documents
    submenu:
      - key: d
        desc: PDF Viewer
        cmd: papers
      - key: i
        desc: Image Viewer
        cmd: loupe
      - key: p
        desc: Image Editor
        cmd: photopea-chromium

  - key: g
    desc: Gaming
    submenu:
      - key: r
        desc: RetroArch
        cmd: retroarch
      - key: s
        desc: Steam
        cmd: steam

  - key: h
    desc: Clip[H]ist
    submenu:
      - key: h
        desc: pick
        cmd: cliphist-fuzzel-img
      - key: w
        desc: wipe
        cmd: cliphist wipe

  - key: m
    desc: Music
    submenu:
      - key: a
        desc: Amberol
        cmd: amberol
      - key: f
        desc: Feishin
        cmd: feishin
      - key: p
        desc: Picard
        cmd: picard
      - key: e
        desc: Editors
        submenu:
          - key: b
            desc: Bitwig Studio
            cmd: bitwig-studio
          - key: m
            desc: MilkyTracker
            cmd: milkytracker
          - key: y
            desc: Audacit[y]
            cmd: audacity
      - key: u
        desc: Utilities
        submenu:
          - key: c
            desc: Crosspipe
            cmd: crosspipe
          - key: e
            desc: EasyEffects
            cmd: easyeffects
          - key: p
            desc: pwvuControl
            cmd: pwvucontrol

  - key: p
    desc: Power
    submenu:
      - key: "l"
        desc: "\U000F033E Lock"
        cmd: swaylock
      - key: "s"
        desc: "\U000F0425 Shutdown"
        cmd: systemctl poweroff
      - key: "r"
        desc: "\U000F0465 Reboot"
        cmd: systemctl reboot
      - key: "u"
        desc: "\U000F0904 S[u]spend"
        cmd: systemctl suspend
      - key: "o"
        desc: "\U000F0343 L[o]gout"
        cmd: niri msg action quit

  - key: r
    desc: Recording
    submenu:
      - key: b
        desc: Clip Brave Audio
        cmd: ~/bin/clip_app brave-origin
      - key: f
        desc: Clip Firefox Audio
        cmd: ~/bin/clip_app firefox
      - key: m
        desc: Clip mpv Audio
        cmd: ~/bin/clip_app mpv
      - key: o
        desc: OBS
        cmd: obs
      - key: r
        desc: Record Screen
        cmd: ~/bin/record-screen
      - key: d
        desc: Screenshot Screen
        cmd: ~/bin/screenshot screen
      - key: s
        desc: Screenshot Selection
        cmd: ~/bin/screenshot selection
      - key: w
        desc: Screenshot Window
        cmd: ~/bin/screenshot window

  - key: s
    desc: Streaming
    submenu:
      - key: b
        desc: VBridger
        cmd: steam steam://rungameid/1898830
      - key: c
        desc: StreamController
        cmd: streamcontroller
      - key: f
        desc: Firebot
        cmd: firebot
      - key: o
        desc: OBS
        cmd: obs
      - key: s
        desc: Start Streaming
        cmd: foot -e ~/bin/streaming_time
      - key: t
        desc: Tuber
        cmd: tuber
      - key: v
        desc: VTube Studio
        cmd: steam steam://rungameid/1325860

  - key: u
    desc: Utilities
    submenu:
      - key: \
        desc: Passwords
        cmd: 1password
      - key: b
        desc: Btop
        cmd: foot -e btop
      - key: c
        desc: Calculator
        cmd: gnome-calculator
      - key: d
        desc: Disks
        cmd: gnome-disks
      - key: f
        desc: Font Viewer
        cmd: gnome-font-viewer
      - key: g
        desc: GPU Top
        cmd: amdgpu_top --gui
      - key: n
        desc: Files
        cmd: nautilus
      - key: t
        desc:  Timer
        cmd: focus-timer

  - key: v
    desc: Video
    submenu:
      - key: f
        desc: Filebot
        cmd: filebot
      - key: j
        desc: Jellyfin
        cmd: jellyfin-chromium
      - key: t
        desc: Twitch
        cmd: twitch-chromium
      - key: v
        desc: Video Trimmer
        cmd: video-trimmer
      - key: w
        desc: Watch url in clipboad
        cmd: ~/bin/watch-url

  - key: w
    desc: Work
    submenu:
      - key: b
        desc: Browser
        cmd: brave
      - key: c
        desc: Cursor
        cmd: cursor
      - key: n
        desc: Netbird-ui
        cmd: netbird-ui
      - key: o
        desc: Obsidian
        cmd: xdg-open "obsidian://open?vault=DNSimple"
      - key: s
        desc: Slack
        cmd: slack
      - key: t
        desc:  Timer
        cmd: focus-timer
      - key: z
        desc: Zoom
        cmd: zoom
