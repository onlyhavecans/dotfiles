---
font: RecMonoDuotone Nerd Font Propo 26
background: "#282828ee" # gruvbox bg0
color: "#ebdbb2ff" # gruvbox fg
border: "#fabd2fff" # gruvbox yellow
border_width: 2
corner_r: 20
padding: 25 # Defaults to corner_r
rows_per_column: 10

# NOTE: Top level = one-tap dailies, app groups, or "what I am doing" groups
# NOTE: Keep launchers shallow: depth <= 2
# NOTE: Nest attributes e.g. audio->volume->mute
# NOTE: Keep desc terse, skimmability wins
# NOTE: Keep alpha sorted, symbols first
# NOTE: Double-tap = the group's default action
# NOTE: Mark non-initial keys like S[l]ack
# NOTE: Free keys: d h k q y z
menu:
  - key: " "
    desc: Terminal
    cmd: foot --login tm
  - key: ","
    desc: Toggle Bar
    cmd: pkill --signal SIGUSR1 waybar

  - key: a
    desc: Audio
    submenu:
      - key: a
        desc: Audacity
        cmd: audacity
      - key: b
        desc: Bitwig Studio
        cmd: bitwig-studio
      - key: e
        desc: EasyEffects
        cmd: easyeffects
      - key: m
        desc: MilkyTracker
        cmd: milkytracker
      - key: p
        desc: pwvuControl
        cmd: pwvucontrol
      - key: q
        desc: qpwGraph
        cmd: qpwgraph

  - key: b
    desc: Browser
    submenu:
      - key: b
        desc: Firefox
        cmd: firefox
      - key: c
        desc: Copy URL
        cmd: ~/bin/url-from-window
      - key: m
        desc: MD URL
        cmd: ~/bin/url-from-window md
      - key: o
        desc: Brave Origin
        cmd: brave-origin
      - key: p
        desc: Private
        cmd: firefox --private-window
      - key: s
        desc: Search
        cmd: ~/bin/search-fuzzel

  - key: c
    desc: Chats
    submenu:
      - key: d
        desc: Discord
        cmd: discord
      - key: n
        desc: NWW
        cmd: nww
      - key: s
        desc: Signal
        cmd: signal-desktop
      - key: t
        desc: TinTin++
        cmd: foot --app-id=tintin ~/bin/tw

  - key: e
    desc: Email
    submenu:
      - key: e
        desc: Email
        cmd: thunderbird
      - key: d
        desc: EmailMe Dictate
        cmd: ~/bin/em-dictate
      - key: t
        desc: EmailMe Type
        cmd: ~/bin/em-fuzzel

  - key: f
    desc: Files
    submenu:
      - key: f
        desc: Files TUI
        cmd: foot --app-id=yazi --working-directory=$HOME/Downloads yazi
      - key: g
        desc: Files GUI
        cmd: nautilus
      - key: u
        desc: Upload Pick
        cmd: ~/bin/upload-yazi

  - key: g
    desc: Gaming
    submenu:
      - key: r
        desc: RetroArch
        cmd: retroarch
      - key: s
        desc: Steam
        cmd: steam

  - key: i
    desc: +Change...
    cmd: wlr-which-key tasks

  - key: j
    desc: Jump
    submenu:
      - key: b
        desc: Browser
        cmd: ~/bin/focus-app-fuzzel firefox
      - key: e
        desc: Email
        cmd: ~/bin/focus-app-fuzzel thunderbird
      - key: j
        desc: Jump to Win
        cmd: ~/bin/focus-app-fuzzel
      - key: o
        desc: Obsidian
        cmd: ~/bin/focus-app-fuzzel obsidian
      - key: s
        desc: Slack
        cmd: ~/bin/focus-app-fuzzel slack
      - key: t
        desc: Terminal
        cmd: ~/bin/focus-app-fuzzel foot

  - key: m
    desc: Music
    submenu:
      - key: a
        desc: Amberol
        cmd: amberol
      - key: k
        desc: Kid3
        cmd: kid3-qt
      - key: p
        desc: Picard
        cmd: picard
      - key: r
        desc: Ratune
        cmd: foot --app-id ratune ratune
      - key: s
        desc: Supersonic
        cmd: supersonic

  - key: o
    desc: Obsidian
    cmd: xdg-open "obsidian://open?vault=Vault"

  - key: p
    desc: +Power
    cmd: wlr-which-key power

  - key: r
    desc: Capture
    submenu:
      - key: b
        desc: Clip Firefox Audio
        cmd: ~/bin/clip_app firefox
      - key: f
        desc: Shot Full Screen
        cmd: ~/bin/screenshot screen
      - key: m
        desc: Clip mpv Audio
        cmd: ~/bin/clip_app mpv
      - key: r
        desc: Shot Selection
        cmd: ~/bin/screenshot selection
      - key: v
        desc: Record Screen
        cmd: ~/bin/record-screen
      - key: w
        desc: Shot Window
        cmd: ~/bin/screenshot window

  - key: s
    desc: Stream
    submenu:
      - key: b
        desc: VBridger
        cmd: steam steam://rungameid/1898830
      - key: c
        desc: StreamController
        cmd: streamcontroller
      - key: f
        desc: Firebot
        cmd: firebot
      - key: o
        desc: OBS Studio
        cmd: obs
      - key: s
        desc: Start Streaming
        cmd: foot ~/bin/streaming_time
      - key: t
        desc: Tuber
        cmd: tuber
      - key: v
        desc: VTube Studio
        cmd: steam steam://rungameid/1325860

  - key: t
    desc: Timer
    submenu:
      - key: s
        desc: Start
        cmd: tomat start
      - key: t
        desc: Toggle
        cmd: tomat toggle
      - key: k
        desc: Skip
        cmd: tomat skip
      - key: e
        desc: End
        cmd: tomat stop

  - key: u
    desc: Utilities
    submenu:
      - key: b
        desc: Bitwarden
        cmd: bitwarden
      - key: t
        desc: Top
        cmd: foot --app-id=btop btop
      - key: c
        desc: Calculator
        cmd: gnome-calculator
      - key: e
        desc: Emoji
        cmd: bemoji --type
      - key: g
        desc: GPU Top
        cmd: foot --app-id=amdgpu_top amdgpu_top
      - key: h
        desc: Clip[h]ist
        cmd: cliphist-fuzzel-img
      - key: i
        desc: Image Editor
        cmd: photopea-chromium
      - key: p
        desc: Color [P]icker
        cmd: wl-color-picker --no-notify
      - key: u
        desc: Toggle Touchpad
        cmd: ~/bin/toggle-touchpad
      - key: w
        desc: Wipe Cliphist
        cmd: cliphist wipe

  - key: v
    desc: Video
    submenu:
      - key: f
        desc: Filebot
        cmd: filebot
      - key: j
        desc: Jellyfin
        cmd: jellyfin-chromium
      - key: r
        desc: Video T[r]immer
        cmd: video-trimmer
      - key: t
        desc: Twitch
        cmd: twitch-chromium
      - key: w
        desc: Watch in mpv
        cmd: ~/bin/watch-url

  - key: w
    desc: Work
    submenu:
      - key: "1"
        desc: 1Password
        cmd: 1password
      - key: b
        desc: Browser
        cmd: brave
      - key: c
        desc: Cursor
        cmd: cursor
      - key: d
        desc: DNPull
        cmd: foot --working-directory=$HOME/Code --hold ~/bin/dnpull
      - key: n
        desc: Netbird-ui
        cmd: netbird-ui
      - key: o
        desc: Obsidian
        cmd: xdg-open "obsidian://open?vault=DNSimple"
      - key: s
        desc: Slack
        cmd: slack
      - key: z
        desc: Zoom
        cmd: zoom

  - key: x
    desc: Vo[x]type
    cmd: voxtype record toggle
