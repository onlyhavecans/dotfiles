---
font: RecMonoDuotone Nerd Font Propo 26
background: "#282828ee" # gruvbox bg0
color: "#ebdbb2ff" # gruvbox fg
border: "#fabd2fff" # gruvbox yellow
border_width: 2
corner_r: 20
padding: 25 # Defaults to corner_r
rows_per_column: 13

# NOTE: Top level = one-tap dailies, app groups, or "what I am doing" groups
# NOTE: Keep launchers shallow: depth <= 2
# NOTE: Nest attributes e.g. audio->volume->mute
# NOTE: Keep desc terse, skimmability wins
# NOTE: Keep alpha sorted, symbols first
# NOTE: Double-tap = the group's default action
# NOTE: Mark non-initial keys like S[l]ack
# NOTE: Free keys: d h k q y z
menu:
  - key: " "
    desc: Terminal
    cmd: foot --login tm
  - key: ","
    desc: Toggle Bar
    cmd: pkill --signal SIGUSR1 waybar
  - key: \
    desc: Quick Pass
    cmd: rofi-rbw

  - key: a
    desc: Audio
    submenu:
      - key: a
        desc: Audacity
        cmd: audacity
      - key: b
        desc: Bitwig Studio
        cmd: bitwig-studio
      - key: e
        desc: EasyEffects
        cmd: easyeffects
      - key: m
        desc: Mic
        submenu:
          - key: "0"
            desc: 100%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 100%
          - key: "3"
            desc: 30%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 30%
          - key: m
            desc: Mute
            cmd: wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
      - key: p
        desc: pwvuControl
        cmd: pwvucontrol
      - key: q
        desc: qpwGraph
        cmd: qpwgraph
      - key: t
        desc: Milky[T]racker
        cmd: milkytracker
      - key: v
        desc: Volume
        submenu:
          - key: "0"
            desc: 100%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SINK@ 100%
          - key: "3"
            desc: 30%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SINK@ 30%
          - key: "6"
            desc: 60%
            cmd: wpctl set-volume @DEFAULT_AUDIO_SINK@ 60%
          - key: m
            desc: Mute
            cmd: wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

  - key: b
    desc: Firefox
    cmd: firefox
  - key: B
    desc: Browser
    submenu:
      - key: b
        desc: Brave Origin
        cmd: brave-origin
      - key: c
        desc: Copy URL
        cmd: ~/bin/url-from-window
      - key: m
        desc: MD URL
        cmd: ~/bin/url-from-window md
      - key: p
        desc: Private
        cmd: firefox --private-window
      - key: s
        desc: Search
        cmd: ~/bin/search-fuzzel

  - key: c
    desc: Chats
    submenu:
      - key: d
        desc: Discord
        cmd: discord
      - key: n
        desc: NWW
        cmd: nww
      - key: s
        desc: Signal
        cmd: signal-desktop
      - key: t
        desc: TinTin++
        cmd: foot --app-id=tintin ~/bin/tw

  - key: e
    desc: Email
    cmd: thunderbird

  - key: f
    desc: Files
    cmd: foot --app-id=yazi --working-directory=$HOME/Downloads yazi
  - key: F
    desc: Files
    submenu:
      - key: f
        desc: Files GUI
        cmd: pcmanfm-qt
      - key: u
        desc: Upload
        cmd: ~/bin/upload-yazi

  - key: g
    desc: Gaming
    submenu:
      - key: r
        desc: RetroArch
        cmd: retroarch
      - key: s
        desc: Steam
        cmd: steam

  - key: i
    desc: Timer
    submenu:
      - key: s
        desc: Start
        cmd: tomat start
      - key: t
        desc: Toggle
        cmd: tomat toggle
      - key: k
        desc: Skip
        cmd: tomat skip
      - key: e
        desc: End
        cmd: tomat stop

  - key: j
    desc: Jump
    submenu:
      - key: b
        desc: Browser
        cmd: ~/bin/focus-app-fuzzel firefox
      - key: e
        desc: Email
        cmd: ~/bin/focus-app-fuzzel thunderbird
      - key: j
        desc: Jump to Win
        cmd: ~/bin/focus-app-fuzzel
      - key: o
        desc: Obsidian
        cmd: ~/bin/focus-app-fuzzel obsidian
      - key: s
        desc: Slack
        cmd: ~/bin/focus-app-fuzzel slack
      - key: t
        desc: Terminal
        cmd: ~/bin/focus-app-fuzzel foot

  - key: l
    desc: Light
    submenu:
      - key: "1"
        desc: 10%
        cmd: brightnessctl --class=backlight set 10%
      - key: "3"
        desc: 30%
        cmd: brightnessctl --class=backlight set 30%
      - key: "5"
        desc: 50%
        cmd: brightnessctl --class=backlight set 50%
      - key: "7"
        desc: 70%
        cmd: brightnessctl --class=backlight set 70%

  - key: m
    desc: Music
    submenu:
      - key: " "
        desc: Play/Pause
        cmd: playerctl play-pause
      - key: ","
        desc: Prev
        cmd: playerctl previous
      - key: "."
        desc: Next
        cmd: playerctl next
      - key: f
        desc: Feishin
        cmd: feishin
      - key: m
        desc: Ratune
        cmd: foot --app-id ratune ratune
      - key: p
        desc: Picard
        cmd: picard
      - key: s
        desc: Strawberry
        cmd: strawberry

  - key: n
    desc: Notes
    submenu:
      - key: d
        desc: Dictate Note
        cmd: ~/bin/em-dictate
      - key: n
        desc: Type Note
        cmd: ~/bin/em-fuzzel
      - key: o
        desc: Obsidian
        cmd: xdg-open "obsidian://open?vault=Vault"

  - key: o
    desc: Obsidian
    cmd: xdg-open "obsidian://open?vault=Vault"

  - key: p
    desc: Power
    submenu:
      - key: l
        desc: "\U000F033E Lock"
        cmd: swaylock
      - key: p
        desc: "\U000F0425 Poweroff"
        cmd: systemctl poweroff
      - key: q
        desc: "\U000F0343 Quit"
        cmd: niri msg action quit
      - key: r
        desc: "\U000F0465 Reboot"
        cmd: systemctl reboot
      - key: s
        desc: "\U000F0904 Suspend"
        cmd: systemctl suspend
      - key: P
        desc: Power Profiles
        submenu:
          - key: s
            desc: Saver
            cmd: powerprofilectl set power-saver
          - key: b
            desc: Balanced
            cmd: powerprofilectl set balanced
          - key: p
            desc: Performance
            cmd: powerprofilectl set performance
      - key: i
        desc: Idle Inhibit
        cmd: ~/bin/idle-toggle
      - key: d
        desc: Do Not Disturb
        cmd: makoctl mode -t do-not-disturb; pkill -RTMIN+11 waybar

  - key: r
    desc: Capture
    submenu:
      - key: b
        desc: Clip Firefox Audio
        cmd: ~/bin/clip_app firefox
      - key: f
        desc: Shot Full Screen
        cmd: ~/bin/screenshot screen
      - key: m
        desc: Clip mpv Audio
        cmd: ~/bin/clip_app mpv
      - key: r
        desc: Shot Selection
        cmd: ~/bin/screenshot selection
      - key: v
        desc: Record Screen
        cmd: ~/bin/record-screen
      - key: w
        desc: Shot Window
        cmd: ~/bin/screenshot window

  - key: s
    desc: Stream
    submenu:
      - key: b
        desc: VBridger
        cmd: steam steam://rungameid/1898830
      - key: c
        desc: StreamController
        cmd: streamcontroller
      - key: d
        desc: Cast
        submenu:
          - key: c
            desc: Clear
            cmd: niri msg action clear-dynamic-cast-target
          - key: m
            desc: Monitor
            cmd: niri msg action set-dynamic-cast-monitor
          - key: w
            desc: Window
            cmd: niri msg action set-dynamic-cast-window
      - key: f
        desc: Firebot
        cmd: firebot
      - key: o
        desc: OBS Studio
        cmd: obs
      - key: s
        desc: Start Streaming
        cmd: foot ~/bin/streaming_time
      - key: t
        desc: Tuber
        cmd: tuber
      - key: v
        desc: VTube Studio
        cmd: steam steam://rungameid/1325860

  - key: t
    desc: Wall [T]heme
    submenu:
      - key: m
        desc: Get Mood
        cmd: notify-send "Wall" "$(wall which)"
      - key: n
        desc: Next
        cmd: wall next
      - key: r
        desc: Random
        cmd: wall random
      - key: s
        desc: Set Mood
        cmd: wall menu

  - key: u
    desc: Utilities
    submenu:
      - key: \
        desc: Passwords
        cmd: bitwarden
      - key: b
        desc: Btop
        cmd: foot --app-id=btop btop
      - key: c
        desc: Calculator
        cmd: qalculate-qt
      - key: e
        desc: Emoji
        cmd: bemoji --type
      - key: g
        desc: GPU Top
        cmd: foot --app-id=amdgpu_top amdgpu_top
      - key: h
        desc: Clip[h]ist
        cmd: cliphist-fuzzel-img
      - key: i
        desc: Image Editor
        cmd: photopea-chromium
      - key: p
        desc: Color [P]icker
        cmd: wl-color-picker --no-notify
      - key: u
        desc: Toggle Touchpad
        cmd: ~/bin/toggle-touchpad
      - key: w
        desc: Wipe Cliphist
        cmd: cliphist wipe

  - key: v
    desc: Video
    submenu:
      - key: f
        desc: Filebot
        cmd: filebot
      - key: j
        desc: Jellyfin
        cmd: jellyfin-chromium
      - key: r
        desc: Video T[r]immer
        cmd: video-trimmer
      - key: t
        desc: Twitch
        cmd: twitch-chromium
      - key: w
        desc: Watch in mpv
        cmd: ~/bin/watch-url

  - key: w
    desc: Work
    submenu:
      - key: "1"
        desc: 1Password
        cmd: 1password
      - key: b
        desc: Browser
        cmd: brave
      - key: c
        desc: Cursor
        cmd: cursor
      - key: d
        desc: DNPull
        cmd: foot --working-directory=$HOME/Code --hold ~/bin/dnpull
      - key: n
        desc: Netbird-ui
        cmd: netbird-ui
      - key: o
        desc: Obsidian
        cmd: xdg-open "obsidian://open?vault=DNSimple"
      - key: s
        desc: Slack
        cmd: slack
      - key: v
        desc: VPN
        submenu:
          - key: a
            desc: Amsterdam
            cmd: ~/bin/vpn ams
          - key: h
            desc: Home
            cmd: ~/bin/vpn home
          - key: n
            desc: New York
            cmd: ~/bin/vpn nyc
          - key: s
            desc: San Francisco
            cmd: ~/bin/vpn sfo
      - key: z
        desc: Zoom
        cmd: zoom

  - key: x
    desc: Vo[x]type
    cmd: voxtype record toggle
