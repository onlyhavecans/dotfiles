# Control center tabs, shortcuts, calendar

[calendar]
enabled = true
refresh_minutes = 120

[control_center]
hidden_tabs = ["screen-time"]

[control_center.calendar]
show_events_card = false
show_week_numbers = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"
